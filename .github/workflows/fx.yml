name: Wisselkoers bijwerken

on:
  schedule:
    - cron: "15 4 * * *"   # elke dag rond 06:15 Nederlandse tijd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Koers ophalen
        run: python3 scripts/fetch_fx.py

      - name: Opslaan als de koers veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx.json
          if git diff --cached --quiet; then
            echo "Geen wijziging."
          else
            git commit -m "Wisselkoers bijgewerkt"
            git push
          fi
